<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- fork/exec -->
  <rect x="270" y="20" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">fork() / exec()</text>
  <text x="340" y="54" text-anchor="middle" font-size="11" fill="#5F5E5A">New process created</text>

  <!-- fork to R -->
  <line x1="340" y1="64" x2="340" y2="106" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- R state -->
  <rect x="230" y="108" width="220" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#27500A">R — Running / Runnable</text>
  <text x="340" y="150" text-anchor="middle" font-size="11" fill="#3B6D11">On CPU or in run queue</text>

  <!-- R to S (left) -->
  <path d="M230 136 L155 136 L155 240 L186 240" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow-green)"/>
  <text x="110" y="188" text-anchor="middle" font-size="10" fill="#0F6E56">wait for I/O</text>
  <text x="110" y="202" text-anchor="middle" font-size="10" fill="#0F6E56">(interruptible)</text>

  <!-- R to D (further left) -->
  <path d="M230 152 L130 152 L130 318 L186 318" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow-green)"/>
  <text x="82" y="278" text-anchor="middle" font-size="10" fill="#0F6E56">wait for I/O</text>
  <text x="82" y="292" text-anchor="middle" font-size="10" fill="#0F6E56">(disk/kernel)</text>

  <!-- R to T (right) -->
  <path d="M450 136 L530 136 L530 240 L494 240" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow-green)"/>
  <text x="568" y="182" text-anchor="middle" font-size="10" fill="#0F6E56">SIGSTOP</text>
  <text x="568" y="196" text-anchor="middle" font-size="10" fill="#0F6E56">or Ctrl+Z</text>

  <!-- S state -->
  <rect x="186" y="212" width="188" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="280" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#0C447C">S — Interruptible sleep</text>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#185FA5">Waiting, wakes on signal</text>

  <!-- S woken back to R -->
  <path d="M280 268 L280 295 L340 295 L340 164" fill="none" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <text x="320" y="288" text-anchor="middle" font-size="10" fill="#185FA5">woken up</text>

  <!-- D state -->
  <rect x="186" y="292" width="188" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="280" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#712B13">D — Uninterruptible</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#993C1D">Disk I/O, cannot be killed</text>

  <!-- D done back to R -->
  <path d="M374 318 L440 318 L440 164 L450 164" fill="none" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow-coral)"/>
  <text x="422" y="250" text-anchor="middle" font-size="10" fill="#993C1D">I/O done</text>

  <!-- T state -->
  <rect x="374" y="212" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="464" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">T — Stopped</text>
  <text x="464" y="252" text-anchor="middle" font-size="11" fill="#854F0B">Paused via SIGSTOP/gdb</text>

  <!-- T SIGCONT back to R -->
  <path d="M374 240 L345 240 L345 164" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow-amber)"/>
  <text x="322" y="210" text-anchor="middle" font-size="10" fill="#BA7517">SIGCONT</text>

  <!-- R exit to Z -->
  <path d="M340 164 L340 390" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="358" y="300" text-anchor="start" font-size="10" fill="#555">exit()</text>

  <!-- S exit to Z -->
  <path d="M280 268 L280 390" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- T exit to X -->
  <path d="M464 268 L464 390" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- Z state -->
  <rect x="188" y="390" width="170" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="273" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#791F1F">Z — Zombie</text>
  <text x="273" y="430" text-anchor="middle" font-size="11" fill="#A32D2D">Done, parent not waited</text>

  <!-- X state -->
  <rect x="400" y="390" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="475" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">X — Dead</text>
  <text x="475" y="430" text-anchor="middle" font-size="11" fill="#5F5E5A">Fully removed by kernel</text>

  <!-- Z to X via wait() -->
  <line x1="358" y1="418" x2="400" y2="418" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="379" y="410" text-anchor="middle" font-size="10" fill="#555">wait()</text>

  <!-- Legend -->
  <rect x="40" y="478" width="12" height="12" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="58" y="490" font-size="11" fill="#555">active / runnable</text>
  <rect x="170" y="478" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="188" y="490" font-size="11" fill="#555">blocked / waiting</text>
  <rect x="310" y="478" width="12" height="12" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="328" y="490" font-size="11" fill="#555">terminal states</text>

  <text x="500" y="490" font-size="10" fill="#888">linux process states</text>
</svg>
